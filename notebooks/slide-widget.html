<script>
// Inside a deck (presenter or Slopshell) keys that the focused control does not
// use are handed to the deck, so page turning keeps working.
addEventListener("keydown", (e) => {
  if (parent === window) return;
  const t = e.target;
  const own = t && t.matches && t.matches("input, textarea, select") &&
    (/^Arrow|^Page|^Home$|^End$/.test(e.key) || t.type === "number");
  if (own) return;
  parent.postMessage({type: "slide-widget-key", key: e.key, shiftKey: e.shiftKey,
    altKey: e.altKey, ctrlKey: e.ctrlKey, metaKey: e.metaKey}, "*");
  if (/^(Arrow|Page)|^ $/.test(e.key)) e.preventDefault();
});
</script>

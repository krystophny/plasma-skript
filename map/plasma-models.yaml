# Edges: reductions from a parent model to a reduced model. The id is
# "<from>--<to>". small: Typst math of the small parameters and ordering.
edges:
  # ----------------------------------------------------------- boundary
  - from: qed
    to: maxwell-lorentz
    method: classical limit
    small: 'hbar omega/(m_(e) c^2) << 1, quad hbar/(p L) << 1'
    assumptions: [no pair creation, photon fields with large occupation numbers]
    lost: pair creation, quantized radiation, radiative corrections; the point-charge self-force must be declared separately
    status: stated
  - from: qed
    to: schroedinger
    method: nonrelativistic electrostatic limit
    small: 'v/c << 1, quad k_B T << m_(e) c^2'
    assumptions: [instantaneous Coulomb interaction, spin as a label, no photons]
    lost: magnetic and retarded interactions, radiation, relativistic kinematics
    status: stated
  # ---------------------------------------------------------- classical
  - from: maxwell-lorentz
    to: darwin
    method: asymptotic ordering
    small: '(v/c)^2 << 1'
    assumptions: [fields determined by instantaneous particle positions and velocities]
    lost: radiation and retardation beyond second order
    status: stated
    evidence: [{literature: "C. G. Darwin, Philos. Mag. 39, 537 (1920)"}]
  - from: darwin
    to: coulomb-nbody
    method: electrostatic limit
    small: 'v/c -> 0'
    assumptions: [magnetic field external and prescribed]
    lost: magnetic interaction between particles
    status: stated
  - from: maxwell-lorentz
    to: full-orbit
    method: prescribed fields
    small: 'abs(delta vb(E)_"self")/abs(vb(E)) << 1'
    assumptions: [the particle does not modify the fields it moves in]
    lost: collective response and self-consistency
    status: stated
    coverage: {plasma: [intro-model-hierarchy, motion-lorentz], kinetic: [N1]}
  - from: maxwell-lorentz

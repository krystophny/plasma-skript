# Map of plasma models: the shared node and edge registry of the Plasma
# Physics, Fusion Physics and Kinetic Theory courses and of the research
# theory map. Schema and editing rules: map/README.md. Rendered by
# src/map.typ into the interactive page map/index.html and the static
# overview figure (chapter 1 of the script, slides/01-introduction.typ).
schema: 1
site: https://krystophny.github.io/plasma-skript/
repository: https://github.com/krystophny/plasma-skript/blob/main/

# Status ladder of a node or edge, weakest first. A status names what the
# public evidence listed with the entry supports, nothing more.
statuses:
  - {id: stated, name: stated, text: written down with assumptions and a source}
  - {id: algebra-checked, name: algebra-checked, text: every identity of the step verified symbolically (SymPy script listed as evidence)}
  - {id: limit-checked, name: limit-checked, text: known special cases and limits reproduced symbolically}
  - {id: defect-measured, name: defect-measured, text: the reduction error measured by a numerical companion experiment across its regime}
  - {id: literature-intake, name: literature intake, text: a cited theorem with its hypotheses, preserved for reproduction; not yet reproduced here}
  - {id: reproduced, name: reproduced, text: the cited proof replayed (checked algebra and complete written proof) and independently reviewed}
  - {id: formally-proved, name: formally proved, text: a machine-checked theorem covering the mathematical content of the step}
  - {id: open-problem, name: open problem, text: no rigorous justification is known; the step is formal}
  - {id: erratum, name: erratum, text: a discrepancy with the cited source, recorded with the corrected statement}

branches:
  # color: graph stroke on a light page; dark: the same on a dark page.
  # tag: [column, row] of the branch name in the graph.
  - {id: quantum, name: Quantum many-body, color: "#A8558A", dark: "#E3A3CF", tag: [0.5, -0.8]}
  - {id: classical, name: Classical many-body, color: "#0072B2", dark: "#7CC3F0", tag: [5.5, -0.8]}
  - {id: collisions, name: Collisions and equilibrium, color: "#9A6B00", dark: "#E8BE5C", tag: [7.4, 7.2]}
  - {id: magnetized, name: Magnetized orbits and kinetics, color: "#00876A", dark: "#5FD3B4", tag: [9.4, 0.15]}
  - {id: fluid, name: Fluids and MHD, color: "#4F6475", dark: "#A9BCCB", tag: [3.2, 10.6]}
  - {id: waves, name: Linear response and waves, color: "#C2510A", dark: "#F4A36B", tag: [0.7, 5.5]}
  - {id: equilibrium, name: MHD equilibrium and stability, color: "#7B4F2C", dark: "#D9AE8A", tag: [6.2, 13.3]}
  - {id: fusion, name: Fusion performance, color: "#5E4FA2", dark: "#B4A9E8", tag: [9.6, 12.4]}

# Course references. plasma: section labels of this script (resolved to
# number, title and link). fusion: blocks of the Fusion Physics plan.
# kinetic: chapters (N) and dated lectures (L) of the Kinetic Theory course,
# SS 2025. research: free text, never a link into a private repository.
courses:
  plasma: {name: Plasma Physics}
  fusion:
    name: Fusion Physics
    units:
      B1: Nuclear energy
      B2: Reaction rates
      B3: Power balance
      B4: Magnetic confinement
      B5: Toroidal geometry
      B6: Tokamak physics
      B7: Stellarator physics
      B8: Heating and exhaust
      B11: Integrated scaling
  kinetic:
    name: Kinetic Theory
    units:
      N1: Primer on particle and collective behaviour
      N2.1: Plasma kinetic equation via Klimontovich
      N2.2: Vlasov equation and its equilibrium solutions
      N2.3.1: Cold plasma waves
      N2.3.2: Thermal effects in electrostatic dispersion
      N2.3.3: Warm Langmuir waves
      N2.3.4: Landau damping
      N2.4: From kinetic theory to fluid equations
      N2.5.1: BGK collision model
      N2.5.2: Fokker-Planck collisions
      N3: Drift kinetics, gyrokinetics, Bernstein waves, Hamiltonian Vlasov
      L2: Particles to plasma
      L3: Klimontovich and the plasma kinetic equation
      L4: Vlasov equation equilibrium solutions
      L5: Local Maxwellian and linear plasma waves
      L6: Cold plasma waves
      L10: Thermal effects in electrostatic waves
      L11: Landau damping
      L12: From kinetic to fluid
  research: {name: Research}

# Nodes: models. pos = [column, row] of the shared layout, first principles
# at row 0. label: short name for the graph, "\n" breaks the line.
nodes:
  # ------------------------------------------------------------ quantum
  - id: qed
    name: Quantum electrodynamics (boundary)
    label: "QED\n(boundary)"
    branch: quantum
    pos: [1.5, 0]
    summary: Relativistic quantum theory of electrons, nuclei and photons. It is the boundary of the map; pair creation, radiative corrections and strong-field cascades stay outside and enter only as provider data.
    equations:
      - 'cal(L) = overline(psi) (i hbar c gamma^mu D_(mu) - m c^2) psi - 1/(4 mu_0) F_(mu nu) F^(mu nu)'
    state: Dirac and photon field operators
    structure: Lorentz and gauge invariance; charge, energy and momentum conservation
    solution: perturbative scattering amplitudes
    status: stated
  - id: schroedinger
    name: Many-body Schrödinger / von Neumann equation
    label: "Many-body\nSchrödinger"
    branch: quantum
    pos: [1.5, 1]
    summary: Nonrelativistic electrons and nuclei interacting through the instantaneous Coulomb potential; the quantum parent of every model below it.
    equations:
      - 'i hbar pdv(Psi, t) = (sum_j -(hbar^2)/(2 m_(j)) laplacian_(j) + sum_(j<k) (q_(j) q_(k))/(4 pi epsilon_0 abs(vb(x)_(j) - vb(x)_(k)))) Psi'
      - 'i hbar pdv(hat(rho), t) = [hat(H), hat(rho)]'
    state: N-body wave function or density operator
    structure: unitary evolution; energy, momentum and particle number conserved; exchange symmetry
    solution: strong solutions in the Hilbert space of square-integrable antisymmetric functions
    status: stated
  - id: quantum-bbgky
    name: Quantum BBGKY hierarchy
    label: "Quantum\nBBGKY"
    branch: quantum
    pos: [0.5, 2]
    summary: Equations for the reduced s-particle density matrices obtained by partial traces; exact and unclosed.
    equations:
      - 'i hbar pdv(rho_(1), t) = [h_(1), rho_(1)] + "Tr"_(2) [V_(12), rho_(12)]'
      - 'rho_(12) = (1 plus.minus P_(12)) rho_(1) rho_(2) + g_(12)'
    state: reduced density matrices $rho_(1), rho_(12), dots$
    structure: exact; the two-particle cumulant $g_(12)$ carries correlations
    solution: trace-class operators
    status: stated
  - id: hartree
    name: Hartree / time-dependent Hartree-Fock
    label: "Hartree,\nTDHF"
    branch: quantum
    pos: [0, 3]
    summary: Mean-field quantum dynamics in which each orbital moves in the Hartree potential of all others, with exchange in the Fock term.
    equations:
      - 'i hbar pdv(phi_(k), t) = (-(hbar^2)/(2 m) laplacian + q V_"H" + V_"x") phi_(k)'
      - 'V_"H"(vb(x)) = integral (q n(vb(x)^prime))/(4 pi epsilon_0 abs(vb(x) - vb(x)^prime)) dif^3 x^prime'
    state: one-body density matrix or orbitals
    structure: Hamiltonian; energy and particle number conserved
    solution: strong solutions for finite-energy orbitals
    status: stated
  - id: negf
    name: Nonequilibrium Green functions (G1-G2)
    label: "NEGF\nG1-G2"
    branch: quantum
    pos: [1, 3]
    summary: Kadanoff-Baym equations for the one-particle Green function; the G1-G2 scheme closes them with second-Born, GW or T-matrix self-energies.
    equations:
      - '(i hbar partial_(t_1) - h_(1)) G(1, 1^prime) = delta(1 - 1^prime) + integral Sigma(1, 2) G(2, 1^prime) dif 2'
    state: one- and two-particle Green functions
    structure: conserving approximations ($Phi$-derivable self-energies) keep particle number, momentum and energy
    solution: time-stepped Green functions on the Keldysh contour
    status: stated
  - id: wigner
    name: Wigner (quantum Vlasov) equation
    label: "Wigner\nequation"
    branch: quantum
    pos: [0, 4.2]
    summary: The one-body density matrix written as a phase-space quasi-distribution; with the Hartree potential it is the quantum counterpart of the Vlasov equation.
    equations:
      - 'W(vb(x), vb(p)) = 1/(2 pi hbar)^3 integral rho(vb(x) + vb(y)/2, vb(x) - vb(y)/2) e^(-i vb(p) dot vb(y) slash hbar) dif^3 y'
      - 'pdv(W, t) + (vb(p) dot grad W)/m = grad V dot pdv(W, vb(p)) + O(hbar^2)'
    state: Wigner function, real but not positive
    structure: Moyal bracket; reduces to the Poisson bracket at order $hbar^0$
    solution: square-integrable Wigner functions
    status: stated
  - id: quantum-lb
    name: Quantum Lenard-Balescu / Uehling-Uhlenbeck
    label: "Quantum\ncollisions"
    branch: quantum
    pos: [1, 4.2]
    summary: Collision operator for weakly coupled quantum plasmas with dynamic screening by the quantum dielectric function and Pauli blocking.
    equations:
      - 'C[f] prop integral w (f^prime_(1) f^prime_(2) (1 - f_(1))(1 - f_(2)) - f_(1) f_(2) (1 - f^prime_(1))(1 - f^prime_(2)))'
    state: one-body Wigner or momentum distribution
    structure: conservation of number, momentum and energy; H-theorem with Fermi-Dirac equilibrium
    solution: formal
    status: stated
  - id: coulomb-scattering-quantum
    name: Quantum two-body Coulomb scattering
    label: "Quantum\nscattering"
    branch: quantum
    pos: [2.2, 2]
    summary: The relative motion of two charges as a Schrödinger scattering problem; the Sommerfeld parameter separates classical from quantum scattering.
    equations:
      - '(-(hbar^2)/(2 mu) laplacian + (q_(1) q_(2))/(4 pi epsilon_0 r)) psi = E psi'
      - 'eta = (q_(1) q_(2))/(4 pi epsilon_0 hbar v)'
    state: relative-motion wave function, partial-wave phase shifts
    structure: the Rutherford cross section is exact at every $eta$
    solution: Coulomb wave functions
    status: stated
  - id: quantum-coulomb-log
    name: Quantum Coulomb logarithm
    label: "Quantum\nCoulomb log"
    branch: quantum
    pos: [2.2, 3]
    summary: The momentum-transfer cross section summed over partial waves fixes the small-impact-parameter cutoff of the Landau operator for all Sommerfeld parameters.
    equations:
      - 'ln Lambda = ln (b_"max"/b_(90)) + ln eta - "Re" psi(1 + i eta)'
    state: Coulomb logarithm as a function of $eta$ and the screening length
    structure: tends to the classical logarithm for $eta >> 1$
    solution: closed form up to convention-dependent constants of order one
    status: stated
  - id: kelbg
    name: Semiclassical pair potentials (Kelbg, Wigner-Kirkwood)
    label: "Kelbg pair\npotential"
    branch: quantum
    pos: [2.2, 4.2]
    summary: An effective classical pair potential from the two-particle Slater sum; it removes the Coulomb singularity at the thermal de Broglie wavelength.
    equations:
      - 'u_"K"(r) = (q_(1) q_(2))/(4 pi epsilon_0 r) (1 - e^(-r^2 slash lambda^2) + (sqrt(pi) r)/lambda (1 - "erf"(r/lambda)))'
      - 'lambda = hbar/sqrt(2 mu k_B T)'
    state: pair potential
    structure: finite at $r = 0$; Coulomb tail
    solution: closed form
    status: stated
  - id: ideal-fermi
    name: Ideal Fermi gas
    label: "Ideal Fermi\ngas"
    branch: quantum
    pos: [3.3, 2]
    summary: Noninteracting electrons in thermal equilibrium; degeneracy sets in when the Fermi energy exceeds the temperature.
    equations:
      - 'f(epsilon) = 1/(e^((epsilon - mu) slash k_B T) + 1)'
      - 'E_(F) = (hbar^2)/(2 m_(e)) (3 pi^2 n_(e))^(2 slash 3)'
    state: occupation numbers
    structure: maximizes entropy at fixed number and energy
    solution: closed form
    status: algebra-checked
    coverage: {plasma: [kinetic-equilibrium]}
    evidence:
      - {sympy: derivations/chapters/ch05_kinetic_theory.py, checks: [Fermi energy]}
  - id: thomas-fermi
    name: Thomas-Fermi model
    label: "Thomas-Fermi"
    branch: quantum
    pos: [3.3, 3]
    summary: Local-density approximation of a degenerate electron gas in a self-consistent potential; gives screening and equations of state of dense matter.
    equations:
      - 'n(vb(x)) = 1/(3 pi^2) ((2 m_(e) (mu + e phi))/(hbar^2))^(3 slash 2)'
      - 'k_"TF"^2 = (3 n_(0) e^2)/(2 epsilon_0 E_(F))'
    state: electron density and potential
    structure: variational (energy functional)
    solution: weak solutions of the Thomas-Fermi equation
    status: stated
  - id: lindhard
    name: Lindhard (RPA) dielectric function
    label: "Lindhard /\nRPA"
    branch: quantum
    pos: [3.3, 4.2]
    summary: Linear response of the Hartree dynamics around an ideal Fermi gas, the quantum dielectric function used for dynamic screening.
    equations:
      - 'epsilon(vb(k), omega) = 1 - (e^2)/(epsilon_0 k^2) chi_(0)(vb(k), omega)'
      - 'chi_(0) = 2/V sum_(vb(p)) (f(vb(p)) - f(vb(p) + hbar vb(k)))/(hbar omega + epsilon_(vb(p)) - epsilon_(vb(p) + hbar vb(k)) + i 0^+)'
    state: dielectric function
    structure: causal (Kramers-Kronig); f-sum rule
    solution: closed form for the ideal Fermi gas
    status: stated
  # ---------------------------------------------------------- classical
  - id: maxwell-lorentz
    name: Maxwell-Lorentz N-body system
    label: "Maxwell-Lorentz\nN-body"
    branch: classical
    pos: [5.5, 0]
    summary: All charged particles, relativistic, coupled to the electromagnetic field they generate. The most complete classical plasma model.
    equations:
      - 'dv(vb(p)_(i), t) = q_(i) (vb(E) + vb(v)_(i) times vb(B))(vb(x)_(i), t)'
      - 'curl vb(B) = mu_0 vb(J) + 1/c^2 pdv(vb(E), t), quad vb(J) = sum_i q_(i) vb(v)_(i) delta(vb(x) - vb(x)_(i))'
    state: particle positions and momenta; fields $vb(E), vb(B)$
    structure: Lorentz invariance; energy and momentum of particles plus field conserved; self-force is a separate declared choice
    solution: requires a regularized or declared self-interaction for point charges
    status: stated
    coverage: {plasma: [intro-model-hierarchy], kinetic: [L2]}
  - id: darwin
    name: Darwin N-body system
    label: "Darwin\nN-body"
    branch: classical
    pos: [5.5, 1]
    summary: Particle dynamics to order (v/c)^2 with magnetic interactions but without radiation.
    equations:
      - 'L_"D" = L_"ES" + sum_(i<j) (q_(i) q_(j))/(8 pi epsilon_0 c^2 r_(i j)) (vb(v)_(i) dot vb(v)_(j) + (vb(v)_(i) dot hat(vb(r))_(i j))(vb(v)_(j) dot hat(vb(r))_(i j)))'
    state: particle positions and velocities
    structure: Lagrangian; energy and momentum conserved; no radiation
    solution: classical ODE solutions away from collisions
    status: stated
  - id: coulomb-nbody
    name: Electrostatic (Coulomb) N-body system
    label: "Coulomb\nN-body"
    branch: classical
    pos: [5.5, 2]
    summary: Nonrelativistic point charges with instantaneous Coulomb forces and prescribed external fields.
    equations:
      - 'm_(i) dv(vb(v)_(i), t) = sum_(j != i) (q_(i) q_(j) (vb(x)_(i) - vb(x)_(j)))/(4 pi epsilon_0 abs(vb(x)_(i) - vb(x)_(j))^3) + q_(i) (vb(E)_"ext" + vb(v)_(i) times vb(B)_"ext")'
    state: $6 N$ phase-space coordinates
    structure: Hamiltonian; Liouville's theorem; energy, momentum, angular momentum conserved
    solution: global classical solutions for almost every initial condition
    status: stated
  - id: klimontovich
    name: Klimontovich equation
    label: "Klimontovich"
    branch: classical
    pos: [5.5, 3]
    summary: The exact phase-space density of point particles; it obeys a Vlasov-like equation with the microscopic fields.
    equations:
      - 'N_(s)(vb(x), vb(v), t) = sum_(i in s) delta(vb(x) - vb(x)_(i)(t)) delta(vb(v) - vb(v)_(i)(t))'
      - 'pdv(N_(s), t) + vb(v) dot grad N_(s) + q_(s)/m_(s) (vb(E)^"m" + vb(v) times vb(B)^"m") dot pdv(N_(s), vb(v)) = 0'
    state: empirical measure on phase space; microscopic fields
    structure: exact rewriting of the N-body system
    solution: measure-valued
    status: stated
    coverage: {kinetic: [N2.1, L3]}
  - id: bbgky
    name: BBGKY hierarchy
    label: "BBGKY\nhierarchy"
    branch: classical
    pos: [5.5, 4]
    summary: Marginals of the Liouville density; the equation for the s-particle distribution involves the (s+1)-particle distribution.
    equations:
      - 'pdv(f_(1), t) + vb(v)_(1) dot pdv(f_(1), vb(x)_(1)) = -integral vb(a)_(12) dot pdv(f_(12), vb(v)_(1)) dif z_(2)'
      - 'f_(12) = f_(1) f_(2) + g_(12)'
    state: reduced distributions $f_(1), f_(12), dots$
    structure: exact and unclosed; correlations in the cumulants $g_(12), dots$
    solution: classical or weak solutions of the Liouville equation
    status: stated
  - id: ybg
    name: Equilibrium YBG equations and closures
    label: "YBG, HNC\nclosures"
    branch: classical
    pos: [6.9, 4.2]
    summary: Stationary canonical BBGKY for pair correlations, closed by Kirkwood superposition or the hypernetted-chain approximation; the reference for strongly coupled equilibria.
    equations:
      - 'k_B T grad_(1) g_(12) = -g_(12) grad_(1) phi_(12) - n integral g_(123) grad_(1) phi_(13) dif^3 x_(3)'
      - 'h = c + n c * h, quad g = e^(-beta phi + h - c)'
    state: pair distribution $g(r)$
    structure: Ornstein-Zernike relation; thermodynamic consistency checks
    solution: fixed points of the closure
    status: stated
    coverage: {research: [kin6d]}
  - id: debye-hueckel
    name: Debye-Hückel screening
    label: "Debye\nscreening"
    branch: classical
    pos: [2.9, 7.25]
    summary: Linearized Poisson-Boltzmann response of a weakly coupled plasma to a test charge.
    equations:
      - 'laplacian phi = phi/lambda_(D)^2 - rho_"ext"/epsilon_0'
      - 'phi = Q/(4 pi epsilon_0 r) e^(-r slash lambda_(D))'
    state: electrostatic potential
    structure: linear, radially symmetric Green function
    solution: closed form
    status: algebra-checked
    coverage: {plasma: [intro-debye-shielding, debye-finite-source, debye-collective-validity]}
    evidence:
      - {sympy: derivations/chapters/ch02_debye_shielding.py, checks: [Debye length, Screened point charge, Matched finite-source Debye response]}
  - id: vlasov
    name: Vlasov-Maxwell / Vlasov-Poisson
    label: "Vlasov"
    branch: classical
    pos: [4.4, 5]
    summary: Collisionless mean-field kinetic equation for each species in the self-consistent smooth fields.
    equations:
      - 'pdv(f_(s), t) + vb(v) dot grad f_(s) + q_(s)/m_(s) (vb(E) + vb(v) times vb(B)) dot pdv(f_(s), vb(v)) = 0'
      - 'div vb(E) = 1/epsilon_0 sum_s q_(s) integral f_(s) dif^3 v'
    state: distribution functions $f_(s)(vb(x), vb(v), t)$; fields
    structure: Hamiltonian (Morrison-Marsden-Weinstein bracket); Casimirs $integral G(f) dif^6 z$; energy and momentum conserved
    solution: classical solutions in 3D (Vlasov-Poisson); weak and renormalized solutions in general
    status: algebra-checked
    coverage: {plasma: [kinetic-derivatives, kinetic-boltzmann], kinetic: [N2.2, L4], research: [kin6d]}
    evidence:
      - {sympy: derivations/chapters/ch05_kinetic_theory.py, checks: [Conservative and convective kinetic equation, Particle-number conservation]}
  # --------------------------------------------------------- collisions
  - id: rutherford
    name: Binary Coulomb collisions
    label: "Binary\ncollisions"
    branch: collisions
    pos: [4.3, 3]
    summary: Rutherford scattering of two charges, the 90-degree impact parameter and the classical Coulomb logarithm from cutoffs at $b_(90)$ and $lambda_(D)$.
    equations:
      - 'tan (chi/2) = b_(90)/b, quad b_(90) = (q_(1) q_(2))/(4 pi epsilon_0 mu v^2)'
      - 'ln Lambda = ln (lambda_(D)/b_(90))'
    state: impact parameter, relative speed
    structure: energy and angular momentum of the pair conserved
    solution: closed-form orbits
    status: algebra-checked
    coverage: {plasma: [kinetic-collisions, coulomb-collisions]}
    evidence:
      - {sympy: derivations/chapters/ch09_collisions_conductivity.py, checks: [Rutherford deflection and the 90-degree impact parameter, Coulomb logarithm and plasma parameter]}
      - {sympy: derivations/chapters/ch05_kinetic_theory.py, checks: [Ninety-degree impact parameter, Coulomb logarithm and deflection frequency]}
  - id: lenard-balescu
    name: Lenard-Balescu equation
    label: "Lenard-\nBalescu"
    branch: collisions
    pos: [5.6, 5]
    summary: Collision operator of a weakly coupled plasma with dynamic screening by the plasma dielectric function; no cutoff is needed at large impact parameters.
    equations:
      - 'C[f] = partial_(vb(v)) dot integral bold(Q)(vb(v), vb(v)^prime) dot (partial_(vb(v)) - m/m^prime partial_(vb(v)^prime)) f f^prime dif^3 v^prime'
      - 'bold(Q) prop integral (vb(k) vb(k))/(k^4 abs(epsilon(vb(k), vb(k) dot vb(v)))^2) delta(vb(k) dot (vb(v) - vb(v)^prime)) dif^3 k'
    state: one-particle distributions
    structure: conservation of number, momentum and energy; H-theorem
    solution: formal; logarithmic divergence at small impact parameters
    status: stated
  - id: landau
    name: Landau collision operator
    label: "Landau\noperator"
    branch: collisions
    pos: [5.6, 6]
    summary: Small-angle Coulomb collisions with the Coulomb logarithm as the only remnant of screening; the standard collision operator of fusion plasmas.
    equations:
      - 'C_(s s^prime) = (q_(s)^2 q_(s^prime)^2 ln Lambda)/(8 pi epsilon_0^2 m_(s)) partial_(vb(v)) dot integral bold(U)(vb(u)) dot ((f^prime_(s^prime) partial_(vb(v)) f_(s))/m_(s) - (f_(s) partial_(vb(v)^prime) f^prime_(s^prime))/m_(s^prime)) dif^3 v^prime'
      - 'bold(U)(vb(u)) = (u^2 bold(I) - vb(u) vb(u))/u^3, quad vb(u) = vb(v) - vb(v)^prime'
    state: one-particle distributions
    structure: metriplectic (GENERIC) form; conservation of number, momentum and energy; H-theorem; Maxwellian null space
    solution: H-solutions for the Coulomb case
    status: stated
    coverage: {kinetic: [N2.5.2], research: [kin6d, NEO-2]}
  - id: boltzmann
    name: Boltzmann collision operator
    label: "Boltzmann\noperator"
    branch: collisions
    pos: [6.8, 5.4]
    summary: Binary collisions with short-range forces under molecular chaos; in plasmas it describes collisions with neutrals.
    equations:
      - 'C[f] = integral.double (f^prime f^prime_(1) - f f_(1)) abs(vb(v) - vb(v)_(1)) sigma(Omega) dif Omega dif^3 v_(1)'
    state: one-particle distributions
    structure: conservation of number, momentum and energy; H-theorem
    solution: renormalized solutions (DiPerna-Lions)
    status: stated
    coverage: {plasma: [kinetic-boltzmann, neutral-collisions]}
  - id: fokker-planck
    name: Rosenbluth Fokker-Planck operator
    label: "Fokker-\nPlanck"
    branch: collisions
    pos: [5.6, 7]
    summary: The Landau operator written as drag and diffusion in velocity space with the Rosenbluth potentials.
    equations:
      - 'C[f] = -partial_(vb(v)) dot (vb(A) f) + 1/2 partial_(vb(v)) partial_(vb(v)) : (bold(D) f)'
      - 'H = integral (f^prime)/abs(vb(v) - vb(v)^prime) dif^3 v^prime, quad G = integral abs(vb(v) - vb(v)^prime) f^prime dif^3 v^prime'
    state: one-particle distributions; Rosenbluth potentials $H, G$
    structure: as the Landau operator
    solution: as the Landau operator
    status: stated
    coverage: {kinetic: [N2.5.2], research: [kin6d]}
  - id: bgk
    name: BGK relaxation operator
    label: "BGK\nmodel"
    branch: collisions
    pos: [6.9, 6.6]
    summary: Relaxation toward the local Maxwellian with the same density, flow and temperature.
    equations:
      - 'C[f] = -nu (f - f_(M)[n, vb(u), T])'
    state: one-particle distribution
    structure: conserves number, momentum and energy; H-theorem
    solution: classical solutions
    status: algebra-checked
    coverage: {plasma: [moments-closures], kinetic: [N2.5.1]}
    evidence:
      - {sympy: derivations/chapters/ch06_moments.py, checks: [BGK collision moments]}
  - id: thermal-equilibrium
    name: Thermal equilibrium (Maxwell-Boltzmann)
    label: "Maxwellian\nequilibrium"
    branch: collisions
    pos: [3.6, 6.3]
    summary: The null space of the collision operators; with a potential it is also a stationary solution of the Vlasov equation.
    equations:

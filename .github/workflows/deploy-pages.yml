name: Build and deploy to GitHub Pages

# Plain ubuntu-latest pipeline without Nix.  The Nix flake checks (including
# the NixOS VM site-integration test) run separately in nix-checks.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Typst main, the same commit as flake.nix: 0.15.1 writes bare "&" in SVG
  # link URLs (typst#8672, fixed by typst#8510 after the release).
  TYPST_REV: "d7dfb34ae79689ed78857ab38a3f6a24a1747770"
  RIPGREP_VERSION: "14.1.1"
  # New Computer Modern for Manim's Text labels (Typst embeds its own copy).

jobs:
  derivations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache the Typst binary
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.local/tools
          key: tools-typst-${{ env.TYPST_REV }}
      - name: Build Typst for the derivation section references
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/tools
          cargo install --locked --root ~/.local/tools-build \
            --git https://github.com/typst/typst --rev "$TYPST_REV" typst-cli
          cp ~/.local/tools-build/bin/typst ~/.local/tools/
      - name: Put Typst on PATH
        run: echo "$HOME/.local/tools" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the SymPy derivations
        run: uv run pytest -q
      - name: Check animation models against physics oracles
        run: uv run python scripts/check-physics.py
      - name: Check animation export revision integrity
        run: python3 scripts/animation-export-test.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache the Typst and ripgrep binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.local/tools
          key: tools-typst-${{ env.TYPST_REV }}-rg-${{ env.RIPGREP_VERSION }}

      - name: Build Typst and install ripgrep
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/tools
          cargo install --locked --root ~/.local/tools-build \
            --git https://github.com/typst/typst --rev "$TYPST_REV" typst-cli
          cp ~/.local/tools-build/bin/typst ~/.local/tools/
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C ~/.local/tools "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"

      - name: Put the tools on PATH
        run: |
          echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-${{ hashFiles('src/**/*.typ', 'scripts/*.typ') }}
          restore-keys: typst-packages-

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the site (derivation plots, then Typst)
        env:
          SITE_DIR: ${{ github.workspace }}/_site
          ANIMATION_HOSTING: "external"
        run: |
          typst --version
          uv run bash scripts/build-site.sh

      - name: Test presenter touch, H.264 and offline playback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          uv run python scripts/present-test.py _site

      - name: Check figure annotations
        run: typst query --root . scripts/check-figures.typ '<physics-check>' >/dev/null

      - name: Verify the site against SPEC.md
        run: bash scripts/verify-spec.sh _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: [site, derivations]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

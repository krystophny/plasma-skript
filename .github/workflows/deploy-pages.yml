name: Build and deploy to GitHub Pages

# Plain ubuntu-latest pipeline without Nix.  The Nix flake checks (including
# the NixOS VM site-integration test) run separately in nix-checks.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: "0.15.0"
  RIPGREP_VERSION: "14.1.1"
  MANIM_VERSION: "0.21.0"
  MEDIA_DIR: ${{ github.workspace }}/.cache/animations
  # New Computer Modern for Manim's Text labels (Typst embeds its own copy).

jobs:
  derivations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Typst for the derivation section references
        run: |
          mkdir -p ~/.local/tools
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/tools typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/tools" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the SymPy derivations
        run: uv run pytest -q
      - name: Check animation models against physics oracles
        run: uv run python scripts/check-physics.py

  animations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Look up the rendered animations
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: .cache/animations
          key: animations-${{ env.MANIM_VERSION }}-${{ hashFiles('animations/**', 'scripts/render-animations.sh') }}
          lookup-only: true

      # Everything below runs only on a cache miss.
      - name: Restore older renders (per-scene stamps skip unchanged scenes)
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/animations
          key: ${{ steps.lookup.outputs.cache-primary-key }}
          restore-keys: animations-${{ env.MANIM_VERSION }}-

      - name: Install Manim system dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          # The scenes use MathTex with the STIX Two template of
          # animations/style.py: fonts-extra carries stix2-type1 (the stix2
          # package); standalone is in latex-extra.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            tipa lmodern dvisvgm >/dev/null

      - uses: astral-sh/setup-uv@v6
        if: steps.lookup.outputs.cache-hit != 'true'

      # The scenes register STIX Two Text from fonts/ themselves.
      - name: Install Manim
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          uv tool install --python 3.12 "manim==${MANIM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render the animations in parallel
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bash scripts/render-animations.sh "$MEDIA_DIR"

      - name: Save the rendered animations
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/animations
          key: ${{ steps.lookup.outputs.cache-primary-key }}

  site:
    needs: animations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache the Typst and ripgrep binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.local/tools
          key: tools-typst-${{ env.TYPST_VERSION }}-rg-${{ env.RIPGREP_VERSION }}

      - name: Install Typst and ripgrep
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/tools
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/tools typst-x86_64-unknown-linux-musl/typst
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C ~/.local/tools "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"

      - name: Put the tools on PATH
        run: |
          echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-${{ hashFiles('src/**/*.typ', 'scripts/*.typ') }}
          restore-keys: typst-packages-

      - name: Restore the rendered animations
        uses: actions/cache/restore@v4
        with:
          path: .cache/animations
          key: animations-${{ env.MANIM_VERSION }}-${{ hashFiles('animations/**', 'scripts/render-animations.sh') }}
          fail-on-cache-miss: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the site (derivation plots, then Typst)
        env:
          SITE_DIR: ${{ github.workspace }}/_site
          SKIP_ANIMATIONS: "1"
        run: |
          typst --version
          uv run bash scripts/build-site.sh

      - name: Check figure annotations
        run: typst query --root . scripts/check-figures.typ '<physics-check>' >/dev/null

      - name: Verify the site against SPEC.md
        run: bash scripts/verify-spec.sh _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: [site, derivations]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

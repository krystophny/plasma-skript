name: Check derivations and site build

# Plain ubuntu-latest pipeline without Nix.  The Nix flake checks (including
# the NixOS VM site-integration test) run separately in nix-checks.yml.

# Pages is deployed by scripts/publish.sh from the local build (gh-pages
# branch); this workflow only checks pull requests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: "0.15.1"
  RIPGREP_VERSION: "14.1.1"
  QUARTO_VERSION: "1.10.18"
  # New Computer Modern for Manim's Text labels (Typst embeds its own copy).

jobs:
  derivations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Typst for the derivation section references
        run: |
          mkdir -p ~/.local/tools
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/tools typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/tools" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Reuse a passed SymPy run for unchanged inputs
        id: derivations
        uses: actions/cache@v4
        with:
          path: .ci/derivations-passed
          key: derivations-passed-${{ hashFiles('derivations/**', 'notebooks/**', 'src/**/*.typ', 'scripts/script-outline.sh', 'pyproject.toml', 'uv.lock') }}
      - name: Run the SymPy derivations
        if: steps.derivations.outputs.cache-hit != 'true'
        run: |
          uv run pytest -q
          mkdir -p .ci && touch .ci/derivations-passed
      - name: Check animation models against physics oracles
        run: uv run python scripts/check-physics.py
      - name: Check animation export revision integrity
        run: python3 scripts/animation-export-test.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache the Typst and ripgrep binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.local/tools
          key: tools-typst-${{ env.TYPST_VERSION }}-rg-${{ env.RIPGREP_VERSION }}

      - name: Install Typst and ripgrep
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/tools
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/tools typst-x86_64-unknown-linux-musl/typst
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C ~/.local/tools "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"

      - name: Put the tools on PATH
        run: |
          echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-${{ hashFiles('src/**/*.typ', 'scripts/*.typ') }}
          restore-keys: typst-packages-

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache the derivation plots
        id: plots
        uses: actions/cache@v4
        with:
          path: |
            derivations/build
            slides/build/script-outline.json
          key: derivation-plots-${{ hashFiles('derivations/**', 'src/**/*.typ', 'scripts/script-outline.sh', 'scripts/prepare-media.py', 'pyproject.toml', 'uv.lock') }}

      - name: Mark restored plots newer than the fresh checkout
        if: steps.plots.outputs.cache-hit == 'true'
        run: find derivations/build slides/build/script-outline.json -exec touch {} +

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Build the site (derivation plots, then Typst)
        env:
          SITE_DIR: ${{ github.workspace }}/_site
          ANIMATION_HOSTING: "external"
        run: |
          typst --version
          uv run bash scripts/build-site.sh

      - name: Test presenter touch, H.264 and offline playback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          uv run python scripts/present-test.py _site

      - name: Check figure annotations
        run: typst query --root . scripts/check-figures.typ '<physics-check>' >/dev/null

      - name: Verify the site against SPEC.md
        run: bash scripts/verify-spec.sh _site

          </div><div class="animation-information"><h1>Coulomb encounter hot</h1><figcaption>The same encounter at <math><mi>𝜂</mi><mo>=</mo><mn>0.03</mn></math>, the relative speed of an electron pair in a <math><mn>10</mn><mspace width="0.1667em"/><mtext>k</mtext><mtext>eV</mtext></math> plasma (relative energy <math><mn>7.6</mn><mspace width="0.1667em"/><mtext>k</mtext><mtext>eV</mtext></math>), on the same axes, clock and colour scale. Now <math><msub><mi>𝑟</mi><mn>0</mn></msub><mo>=</mo><mn>0.06</mn><mi>ƛ</mi></math> lies far inside the packet. The quantum packet passes almost freely: the scattered wave is far below the colour scale. The singlet and triplet fringes are the exchange symmetrization of two overlapping packets; they appear even without interaction. The classical ensemble still keeps a sharp, unresolved hole on the axis, a trajectory feature that the quantum packet does not show.</figcaption>

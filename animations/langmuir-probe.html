          </div><div class="animation-information"><h1>Langmuir probe</h1><figcaption>Probe bias moves the operating point across collection regimes. The retarding branch carries the temperature information in its logarithmic slope, while the saturation scale carries the density information under the stated collection model. This ideal planar illustration uses <math><msub><mi>𝐼</mi><mi>𝑝</mi></msub><mi>/</mi><mrow><mo>(</mo><mrow><mi>𝑒</mi><msub><mi mathvariant="normal">Γ</mi><mrow><mi>𝑒</mi><mo rspace="0em">,</mo><mn>0</mn></mrow></msub><mi>𝐴</mi></mrow><mo>)</mo></mrow><mo>=</mo><mn>0.058</mn><mo>−</mo><mo form="prefix" lspace="0em" rspace="0em">exp</mo><mrow><mo>(</mo><mrow><mo lspace="0em" rspace="0em">min</mo><mrow><mo>(</mo><mrow><mi>𝑢</mi><mo>,</mo><mn>0</mn></mrow><mo>)</mo></mrow></mrow><mo>)</mo></mrow></math>: it is continuous at zero bias and caps the electron contribution at its planar saturation scale. Geometry-dependent rising collection branches require a different model.</figcaption>

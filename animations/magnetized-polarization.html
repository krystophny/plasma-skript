          </div><div class="animation-information"><h1>Magnetized polarization</h1><figcaption>Faraday rotation: a linearly polarized wave can be decomposed into two circular eigenmodes. Because the magnetic field gives them different wave numbers, their relative phase changes along the path and the polarization plane rotates. The prescribed illustration uses <math><msub><mi>𝑘</mi><mo>+</mo></msub><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>1.2</mn></math>, <math><msub><mi>𝑘</mi><mo>−</mo></msub><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>0.8</mn></math>, and <math><mi>𝜔</mi><msub><mi>𝑡</mi><mn>0</mn></msub><mo>=</mo><mn>1</mn></math>, with each component of amplitude <math><msub><mi>𝐸</mi><mn>0</mn></msub><mi>/</mi><mn>2</mn></math>. Here <math><msub><mi>𝐿</mi><mn>0</mn></msub></math>, <math><msub><mi>𝑡</mi><mn>0</mn></msub></math>, and <math><msub><mi>𝐸</mi><mn>0</mn></msub></math> are reference length, time, and electric-field scales. The transverse panel shows the highlighted position <math><mi>𝑧</mi><mo>=</mo><mn>3</mn><msub><mi>𝐿</mi><mn>0</mn></msub></math>. At fixed position the polarization axis is stationary in time; the wave numbers are prescribed.</figcaption>

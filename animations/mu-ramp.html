          </div><div class="animation-information"><h1>Mu ramp</h1><figcaption>An ion in a uniform field that grows smoothly from <math><msub><mi>𝐵</mi><mn>0</mn></msub></math> to <math><mn>2</mn><msub><mi>𝐵</mi><mn>0</mn></msub></math> over about twenty gyrations, computed from the full Lorentz force with the induced electric field of Faraday’s law. The orbit shrinks as <math><msub><mi>𝜌</mi><mi>𝐿</mi></msub><mo>∝</mo><msup><mi>𝐵</mi><mrow><mo>−</mo><mn>1</mn><mi>/</mi><mn>2</mn></mrow></msup></math>, while <math><mi>𝜇</mi></math> and the flux <math><mi>𝜋</mi><msubsup><mi>𝜌</mi><mi>𝐿</mi><mn>2</mn></msubsup><mi>𝐵</mi></math> through the orbit stay constant to better than <math><mn>0.05</mn></math> %. Lengths in the initial <math><msub><mi>𝜌</mi><mi>𝐿</mi></msub></math> and time <math><msub><mi>𝜔</mi><mrow><mi>𝑐</mi><mn>0</mn></mrow></msub><mi>𝑡</mi></math>, both [1], with <math><msub><mi>𝜔</mi><mrow><mi>𝑐</mi><mn>0</mn></mrow></msub><mo>=</mo><msub><mi>𝑞</mi><mi>𝛼</mi></msub><msub><mi>𝐵</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝑚</mi><mi>𝛼</mi></msub></math>.</figcaption>

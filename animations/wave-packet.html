          </div><div class="animation-information"><h1>Wave packet</h1><figcaption>The prescribed carrier and envelope illustrate different phase and group speeds. With <math><mi>𝑋</mi><mo>=</mo><mi>𝑥</mi><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub></math>, <math><mi>𝜏</mi><mo>=</mo><mi>𝑡</mi><mi>/</mi><msub><mi>𝑡</mi><mn>0</mn></msub></math>, and <math><mi>𝐴</mi><mo>=</mo><mi>𝐸</mi><mi>/</mi><msub><mi>𝐸</mi><mn>0</mn></msub></math>, the ansatz is <math><mi>𝐴</mi><mo>=</mo><mo form="prefix" lspace="0em" rspace="0em">exp</mo><mrow><mo>(</mo><mrow><mo>−</mo><mfrac><msup><mrow><mo>(</mo><mrow><mi>𝑋</mi><mo lspace="0em" rspace="0em">−</mo><mn>0.42</mn><mi>𝜏</mi></mrow><mo>)</mo></mrow><mn>2</mn></msup><mrow><mn>2</mn><msup><mrow><mo>(</mo><mn>1.15</mn><mo>)</mo></mrow><mn>2</mn></msup></mrow></mfrac></mrow><mo>)</mo></mrow><mo form="prefix" lspace="0.16666666666666666em" rspace="0em">cos</mo><mrow><mo>(</mo><mrow><mn>5.2</mn><mrow><mo>(</mo><mrow><mi>𝑋</mi><mo>−</mo><mn>0.90</mn><mi>𝜏</mi></mrow><mo>)</mo></mrow></mrow><mo>)</mo></mrow></math>. Here <math><msub><mi>𝐿</mi><mn>0</mn></msub></math>, <math><msub><mi>𝑡</mi><mn>0</mn></msub></math>, and <math><msub><mi>𝐸</mi><mn>0</mn></msub></math> are arbitrary reference length, time, and field scales; velocities are in units <math><msub><mi>𝐿</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝑡</mi><mn>0</mn></msub></math>. Thus <math><mi>𝜎</mi><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>1.15</mn></math>, <math><mi>𝑘</mi><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>5.2</mn></math>, <math><msub><mi>𝑣</mi><mtext>g</mtext></msub><msub><mi>𝑡</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>0.42</mn></math>, and <math><msub><mi>𝑣</mi><mtext>phi</mtext></msub><msub><mi>𝑡</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub><mo>=</mo><mn>0.90</mn></math> are prescribed dimensionless parameters. This ansatz is not an exact solution of the cold-plasma dispersion relation. The phase marker follows a cosine maximum; the varying envelope shifts the maxima of the total field.</figcaption>

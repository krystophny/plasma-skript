<p class="animation-status" role="status"></p></div><div class="animation-information"><h1>Frozen flux</h1><figcaption>Supplementary demonstration. A loop of closed magnetic field lines, the contours of the flux function A_z, sits off-centre in a prescribed cellular vortex u = curl(U L sin(x/L) sin(y/L) e_z), and the induction equation dA_z/dt + u . grad A_z = D_B laplacian A_z is solved on a periodic grid. Twenty-four fluid elements start on the field line A_z = A_0/2. First, at magnetic Reynolds number R_m = U L/D_B = 10^4, the vortex winds the loop into a spiral and the elements stay on their field line: A_z at the elements stays within 2.6 % of its initial value and the peak of A_z within 1.7 %, so the flux between field lines moves with the fluid. Then, from the same start at R_m = 10, the elements are wound up in the same way but the field diffuses through them: A_z at the elements falls to 11 % and the peak to 6 % of A_0 by t U/L = 8. Positions x/L and y/L, time t U/L and A_z/A_0 are normalized, with unit [1].</figcaption>

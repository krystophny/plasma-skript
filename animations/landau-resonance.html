          </div><div class="animation-information"><h1>Landau resonance</h1><figcaption>Landau damping is a phase-correlated exchange between a wave and particles near its phase velocity. The orbit panel instead follows one finite-amplitude test electron without wave feedback, using <math><mi>𝑋</mi><mo>=</mo><mi>𝑥</mi><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub></math>, <math><mi>𝑉</mi><mo>=</mo><mi>𝑣</mi><mi>/</mi><msub><mi>𝑣</mi><mn>0</mn></msub></math>, <math><mi>𝜏</mi><mo>=</mo><mi>𝑡</mi><msub><mi>𝑣</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝐿</mi><mn>0</mn></msub></math>, <math><mrow><mi mathvariant="normal">d</mi><mi>𝑋</mi></mrow><mo lspace="0em" rspace="0em">/</mo><mrow><mi mathvariant="normal">d</mi><mi>𝜏</mi></mrow><mo>=</mo><mi>𝑉</mi></math>, and <math><mrow><mi mathvariant="normal">d</mi><mi>𝑉</mi></mrow><mo lspace="0em" rspace="0em">/</mo><mrow><mi mathvariant="normal">d</mi><mi>𝜏</mi></mrow><mo>=</mo><mo form="prefix">−</mo><mn>0.18</mn><mo form="prefix" lspace="0.16666666666666666em" rspace="0em">sin</mo><mrow><mo>(</mo><mrow><mi>𝑋</mi><mo>−</mo><mn>0.92</mn><mi>𝜏</mi></mrow><mo>)</mo></mrow></math>. It starts at <math><mi>𝑋</mi><mo>=</mo><mo form="prefix">−</mo><mn>1.4</mn></math>, <math><mi>𝑉</mi><mo>=</mo><mn>1.12</mn></math> and displays <math><mi>𝑋</mi><mo>−</mo><mn>0.92</mn><mi>𝜏</mi></math> and <math><mi>𝑉</mi><mo>−</mo><mn>0.92</mn></math>. The field scale is <math><msub><mi>𝐸</mi><mn>0</mn></msub><mo>=</mo><msub><mi>𝑚</mi><mi>𝑒</mi></msub><msubsup><mi>𝑣</mi><mn>0</mn><mn>2</mn></msubsup><mi>/</mi><mrow><mo>(</mo><mrow><mi>𝑒</mi><msub><mi>𝐿</mi><mn>0</mn></msub></mrow><mo>)</mo></mrow></math>; <math><msub><mi>𝐿</mi><mn>0</mn></msub></math> and <math><msub><mi>𝑣</mi><mn>0</mn></msub></math> are reference length and speed. In the distribution panel <math><msub><mi>𝑣</mi><mn>0</mn></msub><mo>=</mo><msub><mi>𝑣</mi><mtext>te</mtext></msub></math>; the plotted <math><msub><mi>𝑓</mi><mn>0</mn></msub></math> is the marginal <math><msub><mi>𝐹</mi><mrow><mi>𝑒</mi><mo rspace="0em">,</mo><mn>0</mn></mrow></msub></math> defined above, with <math><msub><mi>𝐹</mi><mrow><mi>𝑒</mi><mo rspace="0em">,</mo><mn>0</mn></mrow></msub><msub><mi>𝑣</mi><mn>0</mn></msub><mi>/</mi><msub><mi>𝑛</mi><mn>0</mn></msub><mo>=</mo><mo form="prefix" lspace="0em" rspace="0em">exp</mo><mrow><mo>(</mo><mrow><mo>−</mo><msup><mi>𝑉</mi><mn>2</mn></msup></mrow><mo>)</mo></mrow><mi>/</mi><msqrt><mi>𝜋</mi></msqrt></math>.</figcaption>

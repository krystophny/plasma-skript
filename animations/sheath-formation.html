          </div><div class="animation-information"><h1>Sheath formation</h1><figcaption>The prescribed profile uses <math><mi>𝑋</mi><mo>=</mo><mi>𝑥</mi><mi>/</mi><msub><mi>𝜆</mi><mi>𝐷</mi></msub></math>, edge <math><mi>𝑋</mi><mo>=</mo><mn>5</mn></math>, <math><mi>𝜂</mi><mo>=</mo><mn>0.12</mn><msup><mrow><mo>(</mo><mrow><mn>5</mn><mo>−</mo><mi>𝑋</mi></mrow><mo>)</mo></mrow><mn>2</mn></msup></math> inside the sheath, and <math><mi>𝜂</mi><mo>=</mo><mn>0</mn></math> outside. Densities follow <math><msub><mi>𝑛</mi><mi>𝑒</mi></msub><mi>/</mi><msub><mi>𝑛</mi><mn>0</mn></msub><mo>=</mo><mo form="prefix" lspace="0em" rspace="0em">exp</mo><mrow><mo>(</mo><mrow><mo>−</mo><mi>𝜂</mi></mrow><mo>)</mo></mrow></math> and <math><mfrac><msub><mi>𝑛</mi><mi>𝑖</mi></msub><msub><mi>𝑛</mi><mn>0</mn></msub></mfrac><mo>=</mo><mfrac><mn>1.5</mn><msqrt><msup><mn>1.5</mn><mn>2</mn></msup><mo lspace="0em" rspace="0em">+</mo><mn>2</mn><mi>𝜂</mi></msqrt></mfrac></math>; Poisson’s equation is not solved. The electron’s entry normal energy is <math><mn>0.9</mn><msub><mi>𝑘</mi><mi>𝐵</mi></msub><msub><mi>𝑇</mi><mi>𝑒</mi></msub></math>. The electron transit is played in units of <math><msub><mi>𝜆</mi><mi>𝐷</mi></msub><mi>/</mi><msqrt><msub><mi>𝑘</mi><mi>𝐵</mi></msub><msub><mi>𝑇</mi><mi>𝑒</mi></msub><mi>/</mi><msub><mi>𝑚</mi><mi>𝑒</mi></msub></msqrt></math> and the ion transit in units of <math><msub><mi>𝜆</mi><mi>𝐷</mi></msub><mi>/</mi><msub><mi>𝑐</mi><mi>𝑠</mi></msub></math>, so their playback speeds are not comparable. Physically the electron barrier is <math><mo>−</mo><mi>𝑒</mi><mi mathvariant="normal">Φ</mi><mo>></mo><mn>0</mn></math>: reflection requires normal kinetic energy below this barrier, while sufficiently energetic electrons reach the wall. The equations above use distance increasing away from the wall and positive inward ion speed.</figcaption>

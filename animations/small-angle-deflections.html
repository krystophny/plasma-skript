<p class="animation-status" role="status"></p></div><div class="animation-information"><h1>Small angle deflections</h1><figcaption>Supplementary demonstration. 12 000 test electrons cross a field of fixed singly charged ions. Each ion passed deflects an electron by the exact Rutherford angle, tan(theta/2) = b90/b, in a random direction, with impact parameters b drawn uniformly in area up to b_max = 1000 b90. Left: the accumulated deflection of 70 electrons spreads as a cloud of many small kicks; one ringed electron meets a rare strong encounter (b &lt; b90) and jumps. Upper right: the mean-square deflection grows linearly with path length, with slope 59.2 against 8(ln Lambda + C) = 57.4 per 90-degree mean free path, ln Lambda = ln(b_max/b90) = 6.91 and C = 0.27 from the strong encounters. Lower right: every decade of b above b90 contributes almost the same amount, about 8 ln 10, which is why the logarithm appears; all strong encounters together give less than a tenth. Path length s over lambda90 = 1/(n pi b90^2) and b/b90 have unit [1]; angles are in rad.</figcaption>

<p class="animation-status" role="status"></p></div><div class="animation-information"><h1>Diamagnetic drift</h1><figcaption>Supplementary demonstration. About 690 ions gyrate on exact Lorentz-force circles in a uniform magnetic field out of the page; their guiding centres are at rest and fill the plane with the density gradient n = n0(1 + y/L), L = 5 Larmor radii, n0 = 12 per Larmor radius squared. Six vertical lines are cut into bins one Larmor radius high, and every crossing is counted with its direction over two gyration periods. Each ion crosses rightward at the top of its circle and leftward at the bottom; more ions sit above a given height than below it, so the leftward crossings win although no guiding centre moves. The net current j_x/(q n0 v_perp) = -0.0999, averaged over bins and lines (single bins scatter by about 12 % from the finite number of ions), agrees with the diamagnetic current B x grad p/B^2 = -rho_L/(2L) = -0.100 for p = n m v_perp^2/2. Lengths in Larmor radii, time in inverse gyrofrequencies, current in q n0 v_perp, with unit [1].</figcaption>

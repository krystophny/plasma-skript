          </div><div class="animation-information"><h1>Coulomb encounter headon</h1><figcaption>Head-on encounter of two electrons at <math><mi>𝜂</mi><mo>=</mo><mn>3</mn></math> (relative energy <math><mn>0.76</mn><mspace width="0.1667em"/><mtext>eV</mtext></math>), computed with kin6d. All four panels show the same encounter on one logarithmic colour scale: the density of the relative coordinate in the collision plane, with positions <math><mi>𝑘</mi><mi>𝑥</mi></math>, <math><mi>𝑘</mi><mi>𝑧</mi></math> and <math><mi>𝑘</mi><mo>=</mo><mn>1</mn><mi>/</mi><mi>ƛ</mi></math>, at time <math><mi>𝑡</mi><msub><mi>𝑣</mi><mtext>rel</mtext></msub><mi>/</mi><msub><mi>𝑧</mi><mn>0</mn></msub></math>, where <math><msub><mi>𝑧</mi><mn>0</mn></msub><mo>=</mo><mn>20</mn><mi>ƛ</mi></math> is the initial separation (all with unit [1]). Top left: an ensemble of classical trajectories with the initial positions and momenta of the quantum packet (Wigner sampling). Top right: the quantum packet of distinguishable particles. Bottom: the singlet (symmetric) and triplet (antisymmetric) spatial states of identical electrons. Because the electrons are identical, each panel also shows the exchanged labelling <math><mi>𝒓</mi><mo stretchy="false">→</mo><mo form="prefix">−</mo><mi>𝒓</mi></math>. The classical hole <math><mi>𝑟</mi><mo>&lt;</mo><msub><mi>𝑟</mi><mn>0</mn></msub></math> (dashed circle) is reproduced by the distinguishable quantum panel. Exchange adds interference fringes of opposite sign in singlet and triplet, whose average is the distinguishable panel, and the triplet vanishes on the plane <math><mi>𝑧</mi><mo>=</mo><mn>0</mn></math>.</figcaption>

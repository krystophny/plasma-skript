          </div><div class="animation-information"><h1>Debye shielding particles</h1><figcaption>Debye shielding from particle dynamics, computed with kin6d. A classical electron one-component plasma (mobile electrons, uniform neutralizing background in place of immobile ions) fills a periodic cube of edge <math><mn>4</mn><msub><mi>𝜆</mi><mi>𝐷</mi></msub></math> with <math><msub><mi>𝑛</mi><mn>0</mn></msub><msubsup><mi>𝜆</mi><mi>𝐷</mi><mn>3</mn></msubsup><mo>=</mo><mn>100</mn></math>, that is <math><msub><mi>𝑁</mi><mi>𝐷</mi></msub><mo>≈</mo><mn>420</mn></math> and 6400 electrons, interacting by the unsoftened Coulomb force. A fixed test charge of the electrons’ sign sits at the centre. Left: one run, electrons in the slab <math><mrow><mo>|</mo><mi>𝑧</mi><mo>|</mo></mrow><mo>&lt;</mo><msub><mi>𝜆</mi><mi>𝐷</mi></msub><mi>/</mi><mn>2</mn></math> around the charge; a single snapshot shows no visible hole, because beyond <math><mi>𝑟</mi><mo>≈</mo><msub><mi>𝜆</mi><mi>𝐷</mi></msub><mi>/</mi><mn>2</mn></math> the deficit is only a few percent of <math><msub><mi>𝑛</mi><mn>0</mn></msub></math>, smaller than the counting fluctuations. Right: the deficit <math><mo>−</mo><mi>𝛿</mi><msub><mi>𝑛</mi><mi>𝑒</mi></msub><mi>/</mi><mrow><mo>(</mo><mrow><mi>𝜅</mi><msub><mi>𝑛</mi><mn>0</mn></msub></mrow><mo>)</mo></mrow></math> averaged over time up to <math><msub><mi>𝜔</mi><mrow><mi>𝑝</mi><mo rspace="0em">,</mo><mi>𝑒</mi></mrow></msub><mi>𝑡</mi><mo>=</mo><mn>40</mn></math> and over eight independent runs. It follows the linear Debye reference for the periodic cube (solid) and lies far below the unscreened response <math><mn>1</mn><mi>/</mi><mi>𝑟</mi></math> (dashed). Positions are <math><mi>𝑥</mi><mi>/</mi><msub><mi>𝜆</mi><mi>𝐷</mi></msub></math>, <math><mi>𝑦</mi><mi>/</mi><msub><mi>𝜆</mi><mi>𝐷</mi></msub></math>, <math><mi>𝑟</mi><mi>/</mi><msub><mi>𝜆</mi><mi>𝐷</mi></msub></math> and time <math><msub><mi>𝜔</mi><mrow><mi>𝑝</mi><mo rspace="0em">,</mo><mi>𝑒</mi></mrow></msub><mi>𝑡</mi></math>, all with unit [1]. The bars are statistical 95 % intervals, not exact error bounds.</figcaption>

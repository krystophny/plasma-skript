<p class="animation-status" role="status"></p></div><div class="animation-information"><h1>Hard sphere relaxation</h1><figcaption>Supplementary demonstration. Six hundred elastic hard disks in a box start with the same speed v0 in random directions, far from equilibrium. Collisions spread the speeds: within about four collisions per disk the speed histogram settles on the two-dimensional Maxwellian at the same energy, f(v) = (2v/v0^2) exp(-v^2/v0^2) with k_B T = m v0^2/2, and the entropy of the velocity distribution rises from near zero to the Maxwellian value 1 + ln(pi) and then stays flat. The total kinetic energy is conserved to round-off. Speeds in v0, time in mean collision times, entropy per disk, all with unit [1].</figcaption>
